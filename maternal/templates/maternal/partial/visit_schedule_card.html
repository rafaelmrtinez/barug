<!-- Partial: Visit Schedule card -->
<div id="visit_schedule_card" class="card p-3 mb-3" style="display:none;">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h6 class="card-title mb-0">Latest Visit Schedule</h6>
    <button id="btn_visit_schedules" type="button" class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#visitScheduleHistoryModal" style="display:none;">View history</button>
  </div>
  <div class="small">
    <div class="kpi">
      <span>Date</span><span id="visit_sched_date">-</span>
    </div>
    <div class="kpi">
      <span>Time</span><span id="visit_sched_time">-</span>
    </div>
    <div class="kpi">
      <span>Purpose</span><span id="visit_sched_purpose">-</span>
    </div>
    <div class="kpi">
      <span>Notes</span><span id="visit_sched_notes" class="text-truncate" style="max-width: 150px;">-</span>
    </div>
    <div class="kpi">
      <span>Created by</span><span id="visit_sched_creator">-</span>
    </div>
  </div>
</div>
