{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New Report</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root{
      --brand:#7B1E22; --brand-700:#6a1a1e; --accent:#D4AF37;
      --ink:#212529; --muted:#6c757d; --card:#ffffff; --bg:#faf9f8; --ring:rgba(123,30,34,.25);
      --dropdown-bg:#ffffff; --dropdown-border:#c7c7c7; --dropdown-hover:#f3efe9; --dropdown-active:#eadfcd;
      --dropdown-shadow: 0 10px 24px rgba(0,0,0,.12), 0 2px 6px rgba(0,0,0,.06);
    }
    html,body{ background: var(--bg); }
    .page-wrap{ max-width:1120px; margin:0 auto; padding:1.25rem; }
    .hero{ border-radius:16px; background:#fff; border:1px solid rgba(0,0,0,.06); padding:1rem 1.25rem; }
    .hero .title{ font-weight:700; letter-spacing:.2px; margin:0; }
    .hero .eyebrow{ text-transform:uppercase; font-size:.75rem; color:var(--muted); letter-spacing:.18rem; }

    .card{ border:1px solid rgba(0,0,0,.06); border-radius:16px; background:var(--card);
      box-shadow:0 2px 8px rgba(0,0,0,.03), 0 1px 0 rgba(212,175,55,.12) inset; }
    .card .card-header{ background:#fff; border-bottom:1px solid rgba(0,0,0,.06); border-radius:16px 16px 0 0!important; padding:.9rem 1rem; }
    .card .card-body{ padding:1.1rem; }

    .form-label{ font-weight:600; color:var(--ink); }
    .form-control,.input-group-text{ border-radius:.65rem; border-color:rgba(0,0,0,.12); }
    .form-control:focus{ border-color:var(--brand); box-shadow:0 0 0 .2rem var(--ring); }

    .btn-brand{ --bs-btn-bg:var(--brand); --bs-btn-border-color:var(--brand);
      --bs-btn-hover-bg:var(--brand-700); --bs-btn-hover-border-color:var(--brand-700);
      --bs-btn-focus-shadow-rgb:123,30,34; --bs-btn-active-bg:var(--brand-700); --bs-btn-active-border-color:var(--brand-700); color:#fff; }
    .btn-outline-brand{ --bs-btn-color:var(--brand); --bs-btn-border-color:var(--brand);
      --bs-btn-hover-bg:var(--brand); --bs-btn-hover-border-color:var(--brand);
      --bs-btn-active-bg:var(--brand); --bs-btn-active-border-color:var(--brand); color:var(--brand); background:#fff; }
    .btn-link-compact{ border-radius:12px; border:1px solid rgba(0,0,0,.08); padding:.45rem .7rem; color:var(--ink); background:#fff; }
    .btn-link-compact:hover{ border-color:var(--brand); color:var(--brand); }
    .btn i{ vertical-align:-1px; }

    /* party chips */
    .chip{ display:inline-flex; align-items:center; gap:.35rem; padding:.25rem .5rem; border-radius:999px;
           border:1px solid var(--bs-border-color); background:#fff; margin:.15rem .25rem 0 0; font-size:.875rem; }
    .chip .rm{ border:none; background:transparent; padding:0; line-height:1; cursor:pointer; }

    /* modal results */
    .results-viewport{ max-height:320px; overflow:auto; }
    .result-item{ cursor:pointer; }
    .result-item:hover{ background:var(--dropdown-hover); }

    .hint{ color:var(--muted); font-size:.9rem; }
  </style>
</head>

<body>
<div class="page-wrap">

  <!-- Header -->
  <div class="hero mb-3 d-flex align-items-center justify-content-between">
    <div>
      <div class="eyebrow" style="color:#FC9700; letter-spacing:.32em;">BARANGAY SEÑOR SANTO NIÑO</div>
      <h4 class="title" style="color:#7B1E22;">BLOTTER CASE REPORT</h4>
    </div>
    <div class="d-flex align-items-center gap-2">
      <a href="{% url 'lupon_mem:report_list' %}" class="btn btn-link-compact">
        <i class="bi bi-arrow-left me-1"></i> Back to Reports
      </a>
    </div>
  </div>

  <!-- Form Card -->
  <div class="card">
    <div class="card-header d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-journal-plus text-warning"></i>
        <strong>Fill out incident details</strong>
      </div>
      <div class="small hint">Fields with important parties can be searched from the registry.</div>
    </div>

    <div class="card-body">
      <form method="post" class="needs-validation" novalidate>
        {% csrf_token %}

        <!-- Incident -->
        <div class="row g-3 mb-2">
          <div class="col-md-6">
            <label class="form-label">Incident Subject</label>
            <input class="form-control" name="incident_subject" required>
            <div class="invalid-feedback">Required.</div>
          </div>
          <div class="col-md-3">
            <label class="form-label">Date</label>
            <input type="date" class="form-control" name="incident_date">
          </div>
          <div class="col-md-3">
            <label class="form-label">Time</label>
            <input type="time" class="form-control" name="incident_time">
          </div>
          <div class="col-12">
            <label class="form-label">Narrative</label>
            <textarea class="form-control" name="incident_desc" rows="4"></textarea>
          </div>
        </div>

        <!-- Address + Parties -->
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Incident Address ID (optional)</label>
            <input class="form-control" name="incident_address_id" placeholder="e.g., 101">
          </div>

          <!-- Complainant -->
          <div class="col-md-4">
            <label class="form-label d-flex justify-content-between align-items-center">
              <span>Complainant</span>
              <button class="btn btn-sm btn-outline-brand" type="button"
                      data-bs-toggle="modal" data-bs-target="#personModal"
                      data-mode="complainant">
                <i class="bi bi-person-plus me-1"></i> Choose
              </button>
            </label>
            <div id="complainantDisplay" class="form-control bg-body-tertiary" style="min-height:38px; display:flex; align-items:center;">
              <span class="text-muted">No complainant selected</span>
            </div>
            <input type="hidden" name="complainant_id" id="complainantId">
          </div>

          <!-- Respondents -->
          <div class="col-md-4">
            <label class="form-label d-flex justify-content-between align-items-center">
              <span>Respondents</span>
              <button class="btn btn-sm btn-outline-brand" type="button"
                      data-bs-toggle="modal" data-bs-target="#personModal"
                      data-mode="respondent">
                <i class="bi bi-people me-1"></i> Add Respondent
              </button>
            </label>
            <div id="respondentsDisplay" class="form-control bg-body-tertiary" style="min-height:38px;">
              <span class="text-muted">No respondents added</span>
            </div>
            <input type="hidden" name="respondent_ids" id="respondentIds">
          </div>
        </div>

        <div class="d-flex justify-content-end mt-4">
          <button class="btn btn-brand">
            <i class="bi bi-save me-2"></i> Save Report
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Person Picker Modal (shared for complainant/respondent) -->
<div class="modal fade" id="personModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="personModalTitle">Find a person</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <div class="input-group mb-3">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input id="personSearch" type="search" class="form-control" placeholder="Type at least 2 letters…">
        </div>

        <div id="results" class="results-viewport list-group border">
          <div class="list-group-item text-muted">Start typing to search…</div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-outline-brand" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function(){
  // state
  let mode = 'complainant'; // or 'respondent'
  const complainantIdInput = document.getElementById('complainantId');
  const complainantDisplay = document.getElementById('complainantDisplay');
  const respondentIdsInput = document.getElementById('respondentIds');
  const respondentsDisplay = document.getElementById('respondentsDisplay');

  // store respondents with names for nice chips; still post ids (comma-separated)
  const selectedRespondents = new Map(); // id -> name

  // bootstrap modal: set mode based on triggering button
  const personModal = document.getElementById('personModal');
  personModal.addEventListener('show.bs.modal', function (evt){
    const btn = evt.relatedTarget;
    mode = btn?.getAttribute('data-mode') || 'complainant';
    document.getElementById('personModalTitle').textContent =
      (mode === 'complainant') ? 'Choose Complainant' : 'Add Respondent';
    // reset
    document.getElementById('personSearch').value = '';
    setResultsMessage('Start typing to search…', true);
    cancelPending();
  });

  // debounce + abortable search
  const searchBox = document.getElementById('personSearch');
  let debounceTimer=null;
  let pendingController=null;

  function cancelPending(){
    if (pendingController){ try{ pendingController.abort(); }catch(e){} }
    pendingController = null;
  }

  searchBox.addEventListener('input', function(){
    if (debounceTimer) clearTimeout(debounceTimer);
    const q = this.value.trim();
    debounceTimer = setTimeout(()=> doSearch(q), 220);
  });

  async function doSearch(q){
    if (q.length < 2){ setResultsMessage('Type at least 2 letters…', true); return; }
    setResultsMessage('Searching…', true);

    cancelPending();
    pendingController = new AbortController();

    try{
      const url = `{% url 'lupon_mem:person_suggest' %}?q=` + encodeURIComponent(q);
      const res = await fetch(url, {
        headers:{ 'Accept':'application/json', 'X-Requested-With':'XMLHttpRequest' },
        credentials:'same-origin',
        signal: pendingController.signal
      });

      if (!res.ok){
        const txt = await res.text();
        console.error('person_suggest failed:', res.status, txt);
        setResultsMessage(`Search failed (${res.status}).`, false);
        return;
      }

      const data = await res.json().catch(e=>{
        console.error('JSON parse error', e);
        setResultsMessage('Invalid response.', false);
        return null;
      });
      if (!data) return;

      const arr = Array.isArray(data.results) ? data.results : [];
      if (!arr.length){ setResultsMessage('No matches', true); return; }

      const results = document.getElementById('results');
      results.innerHTML = '';
      const frag = document.createDocumentFragment();
      arr.forEach(item=>{
        const btn = document.createElement('button');
        btn.type='button';
        btn.className='list-group-item list-group-item-action d-flex justify-content-between align-items-center result-item';
        btn.innerHTML = `<span>${escapeHtml(item.name || '(no name)')}</span>
                         <span class="badge text-bg-light border">ID ${item.id}</span>`;
        btn.addEventListener('click', ()=> choosePerson(item.id, item.name));
        frag.appendChild(btn);
      });
      results.appendChild(frag);

    }catch(e){
      if (e.name === 'AbortError') return;
      console.error(e);
      setResultsMessage('Search error — see console.', false);
    }
  }

  function setResultsMessage(msg, muted){
    const results = document.getElementById('results');
    results.innerHTML = `<div class="list-group-item ${muted?'text-muted':''}">${escapeHtml(msg)}</div>`;
  }

  function choosePerson(id, name){
    if (mode === 'complainant'){
      // single select
      complainantIdInput.value = id;
      complainantDisplay.innerHTML =
        `<span class="chip">
           ${escapeHtml(name)} <small class="text-muted">(#${id})</small>
           <button type="button" class="rm" title="Remove" aria-label="Remove">
             <i class="bi bi-x-lg"></i>
           </button>
         </span>`;
      complainantDisplay.querySelector('.rm').addEventListener('click', ()=>{
        complainantIdInput.value = '';
        complainantDisplay.innerHTML = `<span class="text-muted">No complainant selected</span>`;
      });
      bootstrap.Modal.getInstance(personModal).hide();
    }else{
      // multi-select
      if (!selectedRespondents.has(id)){
        selectedRespondents.set(id, name || `#${id}`);
        renderRespondentChips();
      }
      bootstrap.Modal.getInstance(personModal).hide();
    }
  }

  function renderRespondentChips(){
    if (!selectedRespondents.size){
      respondentsDisplay.innerHTML = `<span class="text-muted">No respondents added</span>`;
      respondentIdsInput.value = '';
      return;
    }
    respondentsDisplay.innerHTML = '';
    selectedRespondents.forEach((nm,id)=>{
      const chip = document.createElement('span');
      chip.className='chip';
      chip.innerHTML = `${escapeHtml(nm)} <small class="text-muted">(#${id})</small>
                        <button type="button" class="rm" title="Remove" aria-label="Remove">
                          <i class="bi bi-x-lg"></i>
                        </button>`;
      chip.querySelector('.rm').addEventListener('click', ()=>{
        selectedRespondents.delete(id);
        renderRespondentChips();
      });
      respondentsDisplay.appendChild(chip);
    });
    respondentIdsInput.value = Array.from(selectedRespondents.keys()).join(',');
  }

  // util
  function escapeHtml(s){
    return String(s ?? '')
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'","&#39;");
  }
})();
</script>
</body>
</html>
