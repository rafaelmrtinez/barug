{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ page_title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .page-wrap { max-width: 1080px; margin: 0 auto; }
    .card { border-radius: 14px; }
    .form-section-title { font-weight: 600; letter-spacing:.2px; }
    .sticky-actions {
      position: sticky; bottom: 0; background: #fff; border-top: 1px solid #eee;
      padding: .75rem 1rem; display:flex; justify-content: space-between; gap:.5rem;
    }
    .hint { font-size:.85rem; color:#6c757d; }
  </style>
</head>
<body class="bg-light">

<div class="page-wrap py-3">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div>
      <div class="text-uppercase small text-muted">Lupon</div>
      <h4 class="mb-0">New Blotter Case</h4>
    </div>
    <a href="{% url 'lupon_mem:case_list' %}" class="btn btn-outline-secondary">Back to Cases</a>
  </div>

  <form method="post" class="needs-validation" novalidate>
    {% csrf_token %}

    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-8">
            <label class="form-label">Case Title <span class="text-danger">*</span></label>
            <input type="text" class="form-control" name="blotter_case_name" placeholder="e.g., People vs. Juan Dela Cruz" required>
            <div class="invalid-feedback">Case title is required.</div>
          </div>
          <div class="col-md-4">
            <label class="form-label">Complaint Title</label>
            <select class="form-select" name="complaint_title_id">
              <option value="">— Select —</option>
              {% for id, name in lookups.complaint_titles %}
                <option value="{{ id }}">{{ name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label">Case Nature</label>
            <select class="form-select" name="case_nature_id">
              <option value="">— Select —</option>
              {% for id, name in lookups.case_natures %}
                <option value="{{ id }}">{{ name }}</option>
              {% endfor %}
            </select>
            <div class="hint mt-1">e.g., ORAL DEFAMATION, THEFT, etc.</div>
          </div>
          <div class="col-md-4">
            <label class="form-label">Date Filed</label>
            <input type="date" class="form-control" name="date_filed">
          </div>
          <div class="col-md-4">
            <label class="form-label">Time Filed</label>
            <input type="time" class="form-control" name="time_filed">
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4">
            <div class="form-section-title mb-2">Incident</div>
            <label class="form-label">Date</label>
            <input type="date" class="form-control" name="incident_date">
          </div>
          <div class="col-md-4">
            <label class="form-label mt-4 mt-md-0">Time</label>
            <input type="time" class="form-control" name="incident_time">
          </div>
          <div class="col-md-4">
            <label class="form-label mt-4 mt-md-0">Location</label>
            <input type="text" class="form-control" name="incident_location" placeholder="Street / Purok / Landmark">
          </div>

          <div class="col-12">
            <label class="form-label">Incident Description</label>
            <textarea class="form-control" name="incident_desc" rows="4" placeholder="Narrative or summary of the incident..."></textarea>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-6">
            <div class="form-section-title mb-2">Link to Report (optional)</div>
            <select class="form-select" name="blotter_report_id">
              <option value="">— None —</option>
              {% for id, label in lookups.reports %}
                <option value="{{ id }}">#{{ id }} — {{ label }}</option>
              {% endfor %}
            </select>
            <div class="hint mt-1">If this case originated from an intake report.</div>
          </div>
          <div class="col-md-6">
            <div class="form-section-title mb-2">Settlement Status (initial)</div>
            <select class="form-select" name="settlement_status_id">
              <option value="">— Select —</option>
              {% for id, name in lookups.settlement_statuses %}
                <option value="{{ id }}">{{ name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Optional: party IDs if you already have person pickers in your UI -->
    <!--
    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Complainants (Person IDs)</label>
            <input class="form-control" name="complainants[]" placeholder="e.g., 12, 45">
          </div>
          <div class="col-md-6">
            <label class="form-label">Respondents (Person IDs)</label>
            <input class="form-control" name="respondents[]" placeholder="e.g., 78, 99">
          </div>
        </div>
      </div>
    </div>
    -->

    <div class="card shadow-sm">
      <div class="sticky-actions">
        <a href="{% url 'lupon_mem:case_list' %}" class="btn btn-outline-secondary">Cancel</a>
        <button class="btn btn-primary">Create Case</button>
      </div>
    </div>
  </form>
</div>

<script>
(() => {
  const forms = document.querySelectorAll('.needs-validation');
  Array.from(forms).forEach(form => {
    form.addEventListener('submit', event => {
      if (!form.checkValidity()) {
        event.preventDefault(); event.stopPropagation();
      }
      form.classList.add('was-validated');
    }, false);
  });
})();
</script>
</body>
</html>
