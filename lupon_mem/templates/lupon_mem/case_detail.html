<div class="container py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Case {{ case.1 }} — {{ case.2 }}</h4>
    <a class="btn btn-success" href="{% url 'lupon_mem:add_form_choose' case_id %}">+ Add Form</a>
  </div>
  <p class="text-muted">{{ case.4 }}</p>
  <h6 class="mt-4">Attached KP Forms</h6>
  <table class="table table-sm">
    <thead><tr><th>Code</th><th>Form</th><th>Status</th><th>Submitted</th><th></th></tr></thead>
    <tbody>
    {% for s in forms %}
      <tr>
        <td>{{ s.1 }}</td><td>{{ s.2 }}</td><td>{{ s.3 }}</td><td>{{ s.4 }}</td>
        <td><a class="btn btn-outline-primary btn-sm" href="{% url 'lupon_mem:form_edit' case_id s.0 %}">Edit</a></td>
      </tr>
    {% empty %}
      <tr><td colspan="5" class="text-muted">No forms yet.</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
