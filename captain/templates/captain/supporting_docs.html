{% extends 'base.html' %}

{% load static %}

{% block css %}
    <link rel="stylesheet" href="{% static 'css/form.css' %}">
    <link rel="stylesheet" href="{% static 'css/button.css' %}">
    <link rel="stylesheet" href="{% static 'css/modal.css' %}">
    <link rel="stylesheet" href="{% static 'css/progress_bar.css' %}">
{% endblock %}

{% block content %}
<div class="container-fluid pt-3 d-flex flex-column flex-grow-1" style="margin-top: 50px;">

    <!-- <div class="step-progress mb-2">
        <div class="step completed">
            <div class="circle">1</div>
            <div class="label">Personal Information</div>
        </div>
        <div class="step completed">
            <div class="circle">2</div>
            <div class="label">Socioeconomic Information</div>
        </div>
        <div class="step active">
            <div class="circle">3</div>
            <div class="label">Supporting Documents</div>
        </div>
    </div> -->

    <form method="post"
        action="{% url 'captain:staff_selection_non-resident_docs' %}"
        enctype="multipart/form-data"
        class="d-flex flex-column flex-grow-1">

        {% csrf_token %}

        <!-- {% include 'partials/messages.html' %} -->

        <h5>Supporting Documents</h5>
        <div class="row">

            <div class="col-lg-3 col-md-6 col-sm-12">
                <div class="form-floating mb-3">
                    {{form.type_of_id}}
                    <label for="{{ form.type_of_id.id_for_label }}">{{ form.type_of_id.label }}</label>
                </div>
            </div>

            <div class="col-lg-3 col-md-6 col-sm-12">
                <div class="form-floating mb-3">
                    {{form.front_id}}
                    <label for="{{ form.front_id.id_for_label }}">{{ form.front_id.label }}</label>
                </div>
            </div>

            <div class="col-lg-3 col-md-6 col-sm-12">
                <div class="form-floating mb-3">
                    {{form.back_id}}
                    <label for="{{ form.back_id.id_for_label }}">{{ form.back_id.label }}</label>
                </div>
            </div>

            <div class="col-lg-3 col-md-6 col-sm-12">
                <div class="form-floating mb-3">
                    {{form.res_img}}
                    <label for="{{ form.res_img.id_for_label }}">{{ form.res_img.label }}</label>
                </div>
            </div>

            <div class="col-lg-3 col-md-6 col-sm-12">
                <div class="form-floating mb-3">
                    {{form.proof}}
                    <label for="{{ form.proof.id_for_label }}">{{ form.proof.label }}</label>
                </div>
            </div>

        </div>

        <div class="mt-auto button-container">
            <a type="button" class="btn btn-reset" href="{% url 'captain:staff_selection_non-resident' %}">Back</a>
            <button type="submit" class="btn btn-submit"> Continue </button>
        </div>

    </form>

</div>
{% endblock %}
