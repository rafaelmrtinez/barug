{% load static %}

{% load django_bootstrap5 %}
{% bootstrap_css %}
{% bootstrap_javascript %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'css/static_style.css' %}">

    <link rel="icon" type="image/x-icon" href="{% static 'images/brgy-sto-nino.png' %}">
    <title>Forgot Password</title>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        
        <div class="row border rounded-5 p-3 bg-white shadow box-area">

            <div class="col-md-12 right-box">

                <div class="align-items-center">

                    <div class="header-text mb-3 text-start mt-3 align-items-center justify-content-between">
                        <h4>Forgot Password</h4>
                        <p class="text-muted mb-2" style="font-size: 0.9rem;">
                            Please enter the email address associated with your account. <br>
                            We will send you a link to reset your password.
                        </p>
                    </div>

                    <form method="post">
                        {% csrf_token %}

                        <div class="form-floating mb-3">
                            {{ form.email }}
                            <label>Enter your email address</label>
                        </div>

                        <div class="input-group mb-3">
                            <button type="submit" id="submit" name="submit" class="btn btn-submit btn-lg w-100 fs-6">Continue</button>
                        </div>

                    </form>

                </div>

            </div>

        </div>
    </div>
</body>
</html>
