{% load static %}

{% load django_bootstrap5 %}
{% bootstrap_css %}
{% bootstrap_javascript %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'css/static_style.css' %}">

    <link rel="icon" type="image/x-icon" href="{% static 'images/brgy-sto-nino.png' %}">
    <title>Email Confirmed</title>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        
        <div class="row border rounded-5 p-3 bg-white shadow box-area">

            <div class="col-md-12 right-box">

                <div class="align-items-center">

                    <div class="header-text mb-3 text-start mt-3 align-items-center justify-content-between">
                        <h4>Email Address Verification</h4>
                        <p class="text-muted mb-2" style="font-size: 0.9rem;">
                            The email address (replace this with real email) has been verified successfully!
                            You may now
                            <a href="{% url 'authentication:login' %}" style="color: black">
                                login.
                            </a>
                        </p>
                    </div>

                </div>

            </div>

        </div>
    </div>
</body>
</html>
