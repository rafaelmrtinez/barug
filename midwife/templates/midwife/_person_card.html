{% if p %}
  <div class="d-flex justify-content-between">
    <div>
      <div><strong>{{ p.first_name }}{% if p.middle_name %} {{ p.middle_name }}{% endif %} {{ p.last_name }}</strong></div>
      {% if p.full_address %}
        <div class="small text-muted mt-1">{{ p.full_address }}</div>
      {% endif %}
    </div>
    {% if p.person_code %}
      <span class="badge text-bg-secondary align-self-start">{{ p.person_code }}</span>
    {% endif %}
  </div>
{% else %}
  <div class="text-muted">No details available.</div>
{% endif %}
