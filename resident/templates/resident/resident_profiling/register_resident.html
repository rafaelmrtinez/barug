{% extends 'base.html' %}

{% load static %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    
    <div class="row border rounded-5 p-3 bg-white shadow box-area">

        <div class="col-md-12 right-box">

            <div class="align-items-center">

                <div class="header-text mb-3 text-start mt-3 align-items-center justify-content-between">
                    <h4>Forgot Password</h4>
                    <p class="text-muted mb-2" style="font-size: 0.9rem;">
                        Please enter the email address associated with your account. <br>
                        We will send you a link to reset your password.
                    </p>
                </div>

                <div class="input-group mb-3">
                    <a class="btn btn-submit btn-lg w-100 fs-6" href="{% url 'resident:personal_info' %}">Continue</a>
                </div>

            </div>

        </div>

    </div>
</div>
{% endblock %}
