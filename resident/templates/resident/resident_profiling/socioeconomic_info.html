{% extends 'base.html' %}

{% load static %}

{% block content %}
<div class="container-fluid pt-3 d-flex flex-column flex-grow-1" style="margin-top: 40px;">

    <form method="post" class="d-flex flex-column flex-grow-1">
        {% csrf_token %}

        <h5>Socioeconomic Information</h5>
        <div class="row">

            <div class="col-lg-3 col-md-6 col-sm-12">
                <div class="form-floating mb-3">
                    {{form.educational_attainment}}
                    <label for="{{ form.educational_attainment.id_for_label }}">{{ form.educational_attainment.label }}</label>
                </div>
            </div>

            <div class="col-lg-3 col-md-6 col-sm-12">
                <div class="form-floating mb-3">
                    {{form.employment_status}}
                    <label for="{{ form.employment_status.id_for_label }}">{{ form.employment_status.label }}</label>
                </div>   
            </div>

            <div class="col-lg-3 col-md-6 col-sm-12">
                <div class="form-floating mb-3">
                    {{form.occupation}}
                    <label for="{{ form.occupation.id_for_label }}">{{ form.occupation.label }}</label>
                </div>   
            </div>

            <div class="col-lg-3 col-md-6 col-sm-12">
                <div class="form-floating mb-3">
                    {{form.monthly_personal_income}}
                    <label for="{{ form.monthly_personal_income.id_for_label }}">{{ form.monthly_personal_income.label }}</label>
                </div>   
            </div>

        </div>

        <div class="row">

            <div class="col-lg-3 col-md-6 col-sm-12">
                <div class="form-floating mb-3">
                    {{form.gov_program}}
                    <label for="{{ form.gov_program.id_for_label }}">{{ form.gov_program.label }}</label>
                </div>
            </div>

        </div>
        
        <div class="mt-auto button-container justify-content-end mb-2">
            <button class="btn btn-reset">Clear</button>
            <a class="btn btn-submit" href="{% url 'resident:supporting_documents' %}">Continue</a>
        </div>

    </form>

</div>
{% endblock %}
