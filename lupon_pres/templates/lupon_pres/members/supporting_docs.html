{% extends 'base.html' %}

{% load static %}

{% block css %}
    <link rel="stylesheet" href="{% static 'css/form.css' %}">
    <link rel="stylesheet" href="{% static 'css/button.css' %}">
    <link rel="stylesheet" href="{% static 'css/modal.css' %}">
    <link rel="stylesheet" href="{% static 'css/progress_bar.css' %}">
{% endblock %}

{% block content %}
<div class="container-fluid pt-3 d-flex flex-column flex-grow-1" style="margin-top: 50px;">

    <!-- <div class="step-progress mb-2">
        <div class="step completed">
            <div class="circle">1</div>
            <div class="label">Personal Information</div>
        </div>
        <div class="step completed">
            <div class="circle">2</div>
            <div class="label">Socioeconomic Information</div>
        </div>
        <div class="step active">
            <div class="circle">3</div>
            <div class="label">Supporting Documents</div>
        </div>
    </div> -->

    <form method="post"
        action="{% url 'lupon_pres:staff_selection_non-resident_docs' %}"
        enctype="multipart/form-data"
        class="d-flex flex-column flex-grow-1">

        {% csrf_token %}

        <!-- {% include 'partials/messages.html' %} -->

        <h5>Supporting Documents</h5>
        <div class="row">

            <div class="col-lg-3 col-md-6 col-sm-12">
                <div class="form-floating mb-3">
                    {{form.type_of_id}}
                    <label for="{{ form.type_of_id.id_for_label }}">{{ form.type_of_id.label }}</label>
                </div>
            </div>

            <div class="col-lg-3 col-md-6 col-sm-12">
                <div class="form-floating mb-3">
                    {{form.front_id}}
                    <label for="{{ form.front_id.id_for_label }}">{{ form.front_id.label }}</label>
                </div>
            </div>

            <div class="col-lg-3 col-md-6 col-sm-12">
                <div class="form-floating mb-3">
                    {{form.back_id}}
                    <label for="{{ form.back_id.id_for_label }}">{{ form.back_id.label }}</label>
                </div>
            </div>

            <div class="col-lg-3 col-md-6 col-sm-12">
                <div class="form-floating mb-3">
                    {{form.res_img}}
                    <label for="{{ form.res_img.id_for_label }}">{{ form.res_img.label }}</label>
                </div>
            </div>

            <div class="col-lg-3 col-md-6 col-sm-12">
                <div class="form-floating mb-3">
                    {{form.proof}}
                    <label for="{{ form.proof.id_for_label }}">{{ form.proof.label }}</label>
                </div>
            </div>

        </div>

        <div class="mt-auto button-container">
            <a type="button" class="btn btn-reset" href="{% url 'lupon_pres:staff_selection_non-resident' %}">Back</a>
            <button type="submit" class="btn btn-submit"> Continue </button>
        </div>

    </form>

</div>

<script>
(() => {
  const form = document.querySelector('form[action*="staff_selection_non-resident_docs"]');
  if (!form) return;

  const STORAGE_KEY = 'lupon_pres_staff_nonres_docs_data';

  function saveFormData() {
    const formData = {};
    const formElements = form.querySelectorAll('input, select');
    
    formElements.forEach(el => {
      if (el.name === 'csrfmiddlewaretoken') return;
      if (el.type === 'file') {
        if (el.files && el.files.length > 0) {
          formData[el.name + '_has_file'] = true;
        }
      } else {
        formData[el.name] = el.value;
      }
    });
    
    sessionStorage.setItem(STORAGE_KEY, JSON.stringify(formData));
  }

  function restoreFormData() {
    try {
      const savedData = sessionStorage.getItem(STORAGE_KEY);
      if (!savedData) return;
      
      const formData = JSON.parse(savedData);
      const formElements = form.querySelectorAll('input, select');
      let restoredCount = 0;
      
      formElements.forEach(el => {
        if (el.name === 'csrfmiddlewaretoken') return;
        if (el.type === 'file') return;
        if (!formData.hasOwnProperty(el.name)) return;
        
        const savedValue = formData[el.name];
        if (savedValue) {
          el.value = savedValue;
          el.dispatchEvent(new Event('change', { bubbles: true }));
          restoredCount++;
        }
      });
      
      if (restoredCount > 0) {
        console.log(`Docs form data restored: ${restoredCount} fields`);
      }
    } catch (e) {
      console.warn('Failed to restore docs form data:', e);
    }
  }

  form.addEventListener('input', saveFormData);
  form.addEventListener('change', saveFormData);

  form.addEventListener('submit', (e) => {
    if (!e.defaultPrevented) {
      sessionStorage.removeItem(STORAGE_KEY);
    }
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', restoreFormData);
  } else {
    setTimeout(restoreFormData, 100);
  }
})();
</script>

{% endblock %}
