{% for p in purposes %}
  <option value="{{ p.document_purpose_id }}"
          data-amount="{{ p.current_amount }}"
          data-exempt-ftj="{{ p.exempt_ftj|yesno:'1,0' }}"
          data-exempt-senior="{{ p.exempt_senior|yesno:'1,0' }}"
          data-exempt-pwd="{{ p.exempt_pwd|yesno:'1,0' }}"
          data-exempt-indigent="{{ p.exempt_indigent|yesno:'1,0' }}"
          data-exempt-student="{{ p.exempt_student|yesno:'1,0' }}">
    {{ p.purpose_label }} — ₱{{ p.current_amount|floatformat:2 }}
  </option>
{% empty %}
  <option value="">— No purposes available —</option>
{% endfor %}
