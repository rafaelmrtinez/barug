{# templates/paginator.html #}
<nav aria-label="Pagination" class="pager" role="navigation">
  <span class="pager-results">
    Showing {{ page_obj.end_index }}
    of {{ page_obj.paginator.count }} result(s)
  </span>

  <div>
  {% if page_obj.has_previous %}
    <a class="pager-btn" href="?page={{ page_obj.previous_page_number }}">&lt;</a>
  {% else %}
    <span class="pager-btn is-disabled" aria-disabled="true">&lt;</span>
  {% endif %}

  <span class="pager-label">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>

  {% if page_obj.has_next %}
    <a class="pager-btn" href="?page={{ page_obj.next_page_number }}">></a>
  {% else %}
    <span class="pager-btn is-disabled" aria-disabled="true">></span>
  {% endif %}
  </div>
</nav>
